name: Build MyLLaMA Kunpeng920 KylinV10SP3
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup QEMU aarch64
        uses: docker/setup-qemu-action@v3

      - name: Pull Kylin V10 SP3 arm64 image
        run: |
          docker pull --platform linux/arm64 swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/zuoguochen/kylinos:v10sp3-linuxarm64

      - name: Build inside KylinV10SP3 container
        run: |
          docker run --rm -i \
            --platform linux/arm64 \
            -v ${{ github.workspace }}:/work \
            -w /work \
            swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/zuoguochen/kylinos:v10sp3-linuxarm64 \
            bash -eux <<'EOF'
          # ===== 安装基础工具链 =====
          yum install -y \
            git cmake make gcc gcc-c++ gcc-gfortran \
            wget tar gzip bzip2 xz \
            openblas-devel \
            rpm rpm-build \
            patch perl python3 \
            glibc-devel glibc-static \
            libstdc++-devel libstdc++-static \
            zlib-devel zlib-static \
            openssl-devel \
            curl

          # 确认工具链版本
          echo "===== Toolchain versions ====="
          gcc --version | head -n1
          g++ --version | head -n1
          cmake --version | head -n1
          make --version | head -n1
          git --version
          python3 --version

          BUILD_MODE="bisheng_kml"
          # BUILD_MODE="gcc73_simple"

          if [ "${BUILD_MODE}" = "bisheng_kml" ]; then
            echo "===== Build MyLLaMA with BiSheng + KML + SVE ====="
            wget https://github.com/biliops/MyLLaMA/releases/download/v1.0.0/BiShengCompiler-5.1.0.2-aarch64-linux-mini-hpc.tar.gz
            wget https://github.com/biliops/MyLLaMA/releases/download/v1.0.0/kml-2.5.0-1.aarch64.rpm
            tar -zxvf BiShengCompiler-5.1.0.2-aarch64-linux-mini-hpc.tar.gz

            # KML 的 %prein 脚本会检测是否为真实鲲鹏 CPU，
            # 在 QEMU 模拟环境下会失败，因此绕过脚本直接解包安装
            rpm2cpio kml-2.5.0-1.aarch64.rpm | cpio -idmv
            cp -r usr/lib64/* /usr/lib64/ 2>/dev/null || true
            cp -r usr/lib/* /usr/lib/ 2>/dev/null || true
            cp -r opt/* /opt/ 2>/dev/null || true
            mkdir -p /opt/kml/lib
            cp -r usr/lib64/* /opt/kml/lib/ 2>/dev/null || true
            ldconfig

            export PATH=/opt/BiShengCompiler/bin:$PATH
            export LD_LIBRARY_PATH=/opt/kml/lib:$LD_LIBRARY_PATH

            # 校验 BiSheng 编译器与 KML 库是否就绪
            echo "===== BiSheng + KMP check ====="
            which bisheng || which clang || ls /opt/BiShengCompiler/bin/ || true
            ls -l /opt/kml/lib/ | head -n20 || true

            git clone --recursive https://github.com/biliops/MyLLaMA
            cd MyLLaMA
            cmake -B build \
              -DLLAMA_ARM=ON \
              -DLLAMA_ARM_SVE=ON \
              -DLLAMA_BLAS=ON \
              -DLLAMA_BLAS_VENDOR=OpenBLAS \
              -DGGML_USE_KML=ON \
              -DLLAMA_STATIC_LINKING=ON
          else
            echo "===== Build llama.cpp with system gcc7.3 ====="
            git clone https://github.com/ggml-org/llama.cpp
            cd llama.cpp
            git checkout b3000
            git submodule update --init --recursive
            cmake -B build \
              -DLLAMA_ARM=ON \
              -DLLAMA_ARM_SVE=ON \
              -DLLAMA_BLAS=ON \
              -DLLAMA_BLAS_VENDOR=OpenBLAS \
              -DLLAMA_STATIC_LINKING=ON
          fi

          cmake --build build -j$(nproc)

          # 直接输出产物到/work（宿主机workspace）
          cp build/bin/llama-server build/bin/llama-cli /work/
          cd /work
          tar -zcvf llama-kunpeng920-kylin-v10sp3.tar.gz llama-server llama-cli

          # 关键校验：文件不存在直接异常退出，不会假成功
          if [ ! -f "llama-kunpeng920-kylin-v10sp3.tar.gz" ]; then
            echo "ERROR: 编译产物缺失！"
            exit 1
          fi
          ls -lh llama-kunpeng920-kylin-v10sp3.tar.gz
          EOF

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-kunpeng920-kylin-v10sp3
          path: llama-kunpeng920-kylin-v10sp3.tar.gz
