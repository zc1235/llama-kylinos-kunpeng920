name: Build llama.cpp Kunpeng920 KylinV10SP3
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup QEMU aarch64
        uses: docker/setup-qemu-action@v3

      - name: Pull Kylin V10 SP3 arm64 image
        run: |
          docker pull --platform linux/arm64 swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/zuoguochen/kylinos:v10sp3-linuxarm64

      - name: Build inside KylinV10SP3 container
        run: |
          docker run --rm -i \
            --platform linux/arm64 \
            -v ${{ github.workspace }}:/work \
            -w /work \
            swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/zuoguochen/kylinos:v10sp3-linuxarm64 \
            bash -eux <<'EOF'
          # ===== 安装基础工具链 =====
          yum install -y \
            git cmake make gcc gcc-c++ gcc-gfortran \
            wget tar gzip bzip2 xz \
            openblas-devel \
            rpm rpm-build \
            patch perl python3 \
            glibc-devel glibc-static \
            libstdc++-devel libstdc++-static \
            zlib-devel zlib-static \
            openssl-devel \
            curl

          # 确认工具链与 glibc 版本（目标：银河麒麟 V10 SP3，glibc 2.28）
          echo "===== Toolchain versions ====="
          gcc --version | head -n1
          g++ --version | head -n1
          cmake --version | head -n1
          make --version | head -n1
          git --version
          python3 --version
          ldd --version | head -n1

          # ===== 下载 BiSheng 编译器 与 KML 数学库（来自 MyLLaMA v1.0.0 release）=====
          wget -q https://github.com/biliops/MyLLaMA/releases/download/v1.0.0/BiShengCompiler-5.1.0.2-aarch64-linux-mini-hpc.tar.gz
          wget -q https://github.com/biliops/MyLLaMA/releases/download/v1.0.0/kml-2.5.0-1.aarch64.rpm

          # 安装毕昇编译器
          tar -zxvf BiShengCompiler-5.1.0.2-aarch64-linux-mini-hpc.tar.gz -C /opt/
          BISHENG_DIR=$(ls -d /opt/BiShengCompiler-* | head -n1)
          ln -sfn ${BISHENG_DIR} /usr/local/bisheng
          echo "${BISHENG_DIR}/lib" > /etc/ld.so.conf.d/bisheng.conf
          ldconfig

          # 关键：毕昇编译器（clang）默认使用 libc++（include/c++/v1/），
          # 其自带完整的 C++17 支持（含 <filesystem>），无需系统 libstdc++ 头文件。
          # 切勿把系统 libstdc++ 头文件路径加入 -I，否则 libc++ 的 math.h/stdlib.h
          # 会通过 #include_next 错误地找到 libstdc++ 的对应头文件，导致两个
          # C++ 标准库头文件混用，产生海量符号冲突（no member named 'abort' 等）。
          # 因此这里只确认毕昇自带 libc++ 运行库，并显式指定 -stdlib=libc++。
          BISHENG_CXX_INC=""
          BISHENG_CXX_LIB=""
          BISHENG_CXX_INC_FLAG=""
          BISHENG_CXX_LIB_FLAG=""
          if [ -f /usr/local/bisheng/lib/libc++.so ] || [ -f /usr/local/bisheng/lib/libc++.so.1 ]; then
            echo "使用毕昇自带 libc++（含 <filesystem>）"
            BISHENG_CXX_LIB=/usr/local/bisheng/lib
            BISHENG_CXX_LIB_FLAG="-L${BISHENG_CXX_LIB}"
          else
            echo "WARN: 未在 /usr/local/bisheng/lib 找到 libc++.so，尝试在毕昇目录内查找"
            LIBCXX_SO=$(find "${BISHENG_DIR}" -name 'libc++.so*' 2>/dev/null | head -n1)
            if [ -n "${LIBCXX_SO}" ]; then
              BISHENG_CXX_LIB=$(dirname "${LIBCXX_SO}")
              BISHENG_CXX_LIB_FLAG="-L${BISHENG_CXX_LIB}"
              echo "找到 libc++: ${LIBCXX_SO}"
            else
              echo "ERROR: 毕昇未提供 libc++ 运行库，无法使用 libc++ 编译"
              find "${BISHENG_DIR}" -name 'libc++*' 2>/dev/null | head -n10
              exit 1
            fi
          fi

          # KML 的 %prein 脚本会检测是否为真实鲲鹏 CPU，
          # 在 QEMU 模拟环境下会失败，因此绕过脚本直接解包安装
          rpm2cpio kml-2.5.0-1.aarch64.rpm | cpio -idmv
          # 将解包出的 KML 树整体复制到 /usr/local/kml（与知识库 Debian 布局一致）
          mkdir -p /usr/local/kml
          cp -r usr/local/kml/* /usr/local/kml/ 2>/dev/null || true
          cp -r usr/lib64/* /usr/local/kml/lib/ 2>/dev/null || true
          cp -r usr/lib/* /usr/local/kml/lib/ 2>/dev/null || true
          cp -r opt/* /opt/ 2>/dev/null || true
          # 头文件同时放到 /usr/local/kml/include 与 /usr/include（供 cblas.h 查找）
          mkdir -p /usr/local/kml/include
          cp -r usr/include/* /usr/local/kml/include/ 2>/dev/null || true
          cp -r usr/include/* /usr/include/ 2>/dev/null || true
          ldconfig

          # 动态定位 libkblas 实际路径（不同 RPM 布局可能不同）
          KBLAS_SO=$(find /usr/local/kml -name 'libkblas_armv8p*.so' | head -n1)
          if [ -z "${KBLAS_SO}" ]; then
            KBLAS_SO=$(find /usr/local/kml -name 'libkblas*.so' | head -n1)
          fi
          echo "KBLAS_SO=${KBLAS_SO}"
          if [ -z "${KBLAS_SO}" ]; then
            echo "ERROR: 未找到 libkblas 库！"
            find /usr/local/kml -name '*.so' | head -n30
            exit 1
          fi
          KBLAS_DIR=$(dirname "${KBLAS_SO}")
          # 创建 libkblas.so 软链，使 -lkblas 能正确解析
          ln -sfn "${KBLAS_SO}" "${KBLAS_DIR}/libkblas.so"
          echo "KBLAS_DIR=${KBLAS_DIR}"

          export PATH=/usr/local/bisheng/bin:$PATH
          export LD_LIBRARY_PATH=${KBLAS_DIR}:/usr/local/kml/lib:/usr/local/bisheng/lib:${LD_LIBRARY_PATH:-}

          # 校验 BiSheng 编译器与 KML 库是否就绪
          echo "===== BiSheng + KML check ====="
          clang --version | head -n1 || true
          ls -l "${KBLAS_DIR}/" | head -n20 || true

          # 定位 cblas.h（ggml-blas 编译必需）。优先 KML 头文件，否则回退到 OpenBLAS
          BLAS_INCLUDE=""
          if [ -f /usr/local/kml/include/cblas.h ]; then
            BLAS_INCLUDE=/usr/local/kml/include
          elif [ -f /usr/include/cblas.h ]; then
            BLAS_INCLUDE=/usr/include
          elif [ -f /usr/include/openblas/cblas.h ]; then
            BLAS_INCLUDE=/usr/include/openblas
          fi
          if [ -z "${BLAS_INCLUDE}" ]; then
            echo "ERROR: 未找到 cblas.h！请确认 openblas-devel 已安装"
            find /usr -name 'cblas.h' 2>/dev/null | head -n10
            exit 1
          fi
          echo "BLAS_INCLUDE=${BLAS_INCLUDE}"

          # ===== 拉取 llama.cpp 源码（知识库方案：直接使用 ggml-org/llama.cpp）=====
          git clone --depth 1 --branch b9488 https://github.com/ggml-org/llama.cpp
          cd llama.cpp
          git submodule update --init --recursive

          # ===== 编译参数（参考知识库：毕昇 + KML + SVE，目标鲲鹏920 5220）=====
          # 目标特性：NEON=1 ARM_FMA=1 FP16_VA=1 MATMUL_INT8=1 SVE=1 DOTPROD=1 SVE_CNT=32 OPENMP=1 REPACK=1
          cmake -B build \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+fp16+simd+crypto+dotprod+i8mm+sve -mtune=tsv110 -O3 -flto=thin -pipe -fomit-frame-pointer -funroll-loops -ffast-math -fno-finite-math-only -fno-math-errno -falign-functions=32 -fopenmp-simd -DGGML_USE_FP16=1 -I${BLAS_INCLUDE}" \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ -march=armv8.2-a+fp16+simd+crypto+dotprod+i8mm+sve -mtune=tsv110 -O3 -flto=thin -pipe -fomit-frame-pointer -funroll-loops -ffast-math -fno-finite-math-only -fno-math-errno -falign-functions=32 -fopenmp-simd -DGGML_USE_FP16=1 -I${BLAS_INCLUDE}" \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -Wl,-rpath,${KBLAS_DIR}:${BISHENG_CXX_LIB}:/usr/local/bisheng/lib -L${KBLAS_DIR} ${BISHENG_CXX_LIB_FLAG} -lc++ -lc++abi -lkblas" \
            -DCMAKE_LIBRARY_PATH=${KBLAS_DIR} \
            -DCMAKE_INCLUDE_PATH=${BLAS_INCLUDE} \
            -DBLAS_LIBRARIES=${KBLAS_SO} \
            -DBLAS_INCLUDE_DIRS=${BLAS_INCLUDE} \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DGGML_JEMALLOC=ON \
            -DGGML_LTO=ON \
            -DGGML_OPENMP=ON \
            -DGGML_NATIVE=ON \
            -DGGML_BLAS=ON \
            -DGGML_SVE=ON \
            -DGGML_SVE_F16=ON \
            -DGGML_SVE_BF16=ON \
            -DGGML_LAPACK=ON \
            -DGGML_BLAS_VENDOR=Generic \
            -DLLAMA_CUDA=OFF \
            -DLLAMA_METAL=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build --config Release -j$(nproc)

          # 直接输出产物到/work（宿主机workspace）
          cp build/bin/llama-server build/bin/llama-cli /work/
          cd /work
          tar -zcvf llama-kunpeng920-kylin-v10sp3.tar.gz llama-server llama-cli

          # 关键校验：文件不存在直接异常退出，不会假成功
          if [ ! -f "llama-kunpeng920-kylin-v10sp3.tar.gz" ]; then
            echo "ERROR: 编译产物缺失！"
            exit 1
          fi
          ls -lh llama-kunpeng920-kylin-v10sp3.tar.gz
          EOF

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-kunpeng920-kylin-v10sp3
          path: llama-kunpeng920-kylin-v10sp3.tar.gz